name: Shell Script Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: Run ShellCheck
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Run shellcheck on all scripts
      run: |
        echo "Running shellcheck with strict settings..."
        find . -name "*.sh" -type f | while read -r file; do
          echo "Checking: $file"
          shellcheck --severity=warning --shell=bash "$file" || exit 1
        done
        echo "✅ All scripts passed shellcheck"
        
    - name: Validate bash syntax
      run: |
        echo "Validating bash syntax..."
        find . -name "*.sh" -type f -exec bash -n {} \;
        echo "✅ All scripts have valid syntax"
        
    - name: Verify executable permissions
      run: |
        echo "Checking executable permissions..."
        find scripts install -name "*.sh" -type f | while read -r file; do
          if [ ! -x "$file" ]; then
            echo "❌ Missing execute permission: $file"
            exit 1
          fi
        done
        echo "✅ All scripts have correct permissions"
